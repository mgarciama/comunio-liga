<div class="login-modal" id="login-modal">
  <div class="login-box">
    <h3>Acceso Admin</h3>
    <p>Introduce tus credenciales para editar.</p>
    <input type="text" id="login-user" placeholder="Usuario">
    <input type="password" id="login-pass" placeholder="Contraseña">
    <button class="btn" id="login-btn">Entrar</button>
    <p class="err" id="login-err">Credenciales incorrectas</p>
  </div>
</div>
